<p-card styleClass="digit-card">
  <div class="digit-image-container">
    <img
      [src]="'data:image/png;base64,' + digit().digit_image"
      alt="Digit"
      class="digit-image"
    />
  </div>

  <div class="prediction-container">
    <div class="prediction-value">Predicted: {{ digit().prediction }}</div>

    <p-progressBar
      [value]="confidencePercent()"
      [style]="{ height: '10px' }"
      [mode]="'determinate'"
      [color]="progressSeverity()"
    />
    <div class="confidence-text">{{ confidencePercent() }} % confidence</div>
  </div>

  <div class="position-text">Position {{ position() + 1 }}</div>

  <div class="digit-buttons">
    @for (d of availableDigits; track d) {
      <p-button
        [label]="d.toString()"
        [severity]="isSelected(d) ? 'success' : 'secondary'"
        [outlined]="!isSelected(d)"
        size="small"
        styleClass="digit-button"
        (onClick)="onDigitClick(d)"
        [pTooltip]="'Select digit ' + d"
        tooltipPosition="top"
      />
    }
  </div>

  <div class="heatmaps-container">
    <div class="heatmap-item">
      <img
        [src]="'data:image/png;base64,' + digit().heatmap_gradcam"
        alt="Grad-CAM"
        class="heatmap-image"
        pTooltip="Grad-CAM Visualization"
      />
      <div class="heatmap-label">Grad-CAM</div>
    </div>
    <div class="heatmap-item">
      <img
        [src]="'data:image/png;base64,' + digit().heatmap_saliency"
        alt="Saliency"
        class="heatmap-image"
        pTooltip="Saliency Map"
      />
      <div class="heatmap-label">Saliency</div>
    </div>
  </div>
</p-card>
