[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meter-watch"
version = "0.1.0"
description = "Meter digit recognition service"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "requests>=2.31",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "responses>=0.24",
    "import-linter>=2.0",
    "ruff>=0.1",
    "mypy>=1.7",
]
train = [
    "tensorboard>=2.15",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
]

[project.scripts]
meter-watch-serve = "meter_watch.presentation.cli:serve"
meter-watch-train = "meter_watch.ml.cli:train"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["meter_watch"]

[[tool.importlinter.contracts]]
name = "Domain has no outward dependencies"
type = "forbidden"
source_modules = ["meter_watch.domain"]
forbidden_modules = [
    "meter_watch.application",
    "meter_watch.infrastructure",
    "meter_watch.presentation",
    "meter_watch.ml",
    "flask", "sqlalchemy", "torch", "requests", "cv2",
]

[[tool.importlinter.contracts]]
name = "Application depends only on domain"
type = "forbidden"
source_modules = ["meter_watch.application"]
forbidden_modules = [
    "meter_watch.infrastructure",
    "meter_watch.presentation",
]

[[tool.importlinter.contracts]]
name = "Presentation does not depend on infrastructure"
type = "forbidden"
source_modules = ["meter_watch.presentation"]
forbidden_modules = ["meter_watch.infrastructure"]
